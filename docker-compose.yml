services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - KMP_DUPLICATE_LIB_OK=TRUE
      - OMP_NUM_THREADS=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - capstone-net

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-ui
    command: streamlit run ui/main_page.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_HOST=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - capstone-net

networks:
  capstone-net:
    driver: bridge
