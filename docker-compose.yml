services:
  ollama:
    image: ollama/ollama:latest
    container_name: capstone-ollama
    # Start the server, pull the model once (cached in the volume), then keep serving
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull $${LLM_MODEL_NAME} && wait"]
    environment:
      - LLM_MODEL_NAME=llama3.2
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks:
      - capstone-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - KMP_DUPLICATE_LIB_OK=TRUE
      - OMP_NUM_THREADS=1
      - LLM_MODEL_NAME=llama3.2
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First start downloads the embedding model (~2 GB)
      start_period: 600s
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - capstone-net

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-ui
    command: streamlit run ui/main_page.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_HOST=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - capstone-net

volumes:
  ollama-models:
  hf-cache:

networks:
  capstone-net:
    driver: bridge
